<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #0f172a; color: #4ade80; }
        h1 { color: #60a5fa; }
        .box { background: #1e293b; padding: 15px; border-radius: 10px; margin: 10px 0; }
        .ok { color: #4ade80; }
        .err { color: #ef4444; }
        pre { background: #000; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; color: #4ade80; }
        .big { font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔥 HNBF Firebase Test</h1>

    <div class="box">
        <strong>Connection:</strong>
        <div class="big" id="status">⏳ Connecting...</div>
    </div>

    <div class="box">
        <strong>Users count:</strong>
        <div class="big" id="userCount">0</div>
    </div>

    <div class="box">
        <strong>Messages count:</strong>
        <div class="big" id="msgCount">0</div>
    </div>

    <div class="box">
        <strong>Users list:</strong>
        <pre id="usersOutput">Loading...</pre>
    </div>

    <div class="box">
        <strong>Errors:</strong>
        <pre id="errorOutput" class="err">None</pre>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA0H3zIgXlO43MOhQRTfqUiaqpQEi9XRNc",
        authDomain: "hnbmsg.firebaseapp.com",
        databaseURL: "https://hnbmsg-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "hnbmsg",
        storageBucket: "hnbmsg.firebasestorage.app",
        messagingSenderId: "955812071571",
        appId: "1:955812071571:web:362345ff1429096a766566"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const statusEl = document.getElementById('status');
    const usersEl = document.getElementById('usersOutput');
    const userCountEl = document.getElementById('userCount');
    const msgCountEl = document.getElementById('msgCount');
    const errorEl = document.getElementById('errorOutput');

    // Connection
    db.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) {
            statusEl.textContent = '✅ CONNECTED';
            statusEl.className = 'big ok';
        } else {
            statusEl.textContent = '❌ DISCONNECTED';
            statusEl.className = 'big err';
        }
    });

    // Users
    db.ref('users').on('value', (snap) => {
        const users = [];
        snap.forEach(child => users.push({ id: child.key, ...child.val() }));
        userCountEl.textContent = users.length;
        usersEl.textContent = JSON.stringify(users, null, 2);
        console.log('👥 Users:', users);
    }, (error) => {
        errorEl.textContent = '❌ Users error: ' + error.message;
    });

    // Messages
    db.ref('messages').on('value', (snap) => {
        let count = 0;
        snap.forEach(() => count++);
        msgCountEl.textContent = count;
    }, (error) => {
        errorEl.textContent = '❌ Messages error: ' + error.message;
    });

</script>
</body>
</html>
